# Production Laravel app. Pinned so a stray `fly deploy` from this repo cannot
# target another app in the account (php-learning-english-web is suspended).
# CI passes --app explicitly from vars.FLY_APP, which overrides this.
app = "linguist"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.fly"

[deploy]
  release_command = "php artisan migrate --force"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  DB_CONNECTION = "mysql"
  SESSION_DRIVER = "database"
  SESSION_SECURE_COOKIE = "true"
  SESSION_SAME_SITE = "lax"
  CACHE_STORE = "redis"
  QUEUE_CONNECTION = "database"
  DB_QUEUE_RETRY_AFTER = "360"
  REDIS_CLIENT = "phpredis"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
