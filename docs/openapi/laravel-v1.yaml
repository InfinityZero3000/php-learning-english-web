openapi: 3.1.0
info:
  title: Learning English API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Check API health
      operationId: health
      security: []
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version: { const: v1 }
  /api/v1/csrf-cookie:
    get:
      summary: Initialize the CSRF cookie
      operationId: csrfCookie
      security: []
      responses:
        "204":
          description: CSRF cookie initialized
          headers:
            Set-Cookie:
              schema: { type: string }
  /api/v1/vocabulary:
    get:
      summary: Read locally persisted vocabulary
      operationId: listVocabulary
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Vocabulary page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vocabulary" }
                  meta: { type: object }
  /api/v1/auth/register:
    post:
      summary: Register a learner account
      operationId: register
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/login:
    post:
      summary: Log in with a Laravel session
      operationId: login
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "403": { $ref: "#/components/responses/EmailUnverified" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/logout:
    post:
      summary: Log out the current user
      operationId: logout
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/auth/me:
    get:
      summary: Get the current user
      operationId: currentUser
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/email/resend:
    post:
      summary: Resend a pending verification email
      operationId: resendVerification
      security: [{ csrf: [] }]
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      summary: Verify a signed email link
      operationId: verifyEmail
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: hash
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: expires
          required: true
          schema: { type: integer }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to learner frontend
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "403": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/forgot:
    post:
      summary: Request a password reset email
      operationId: forgotPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/reset:
    post:
      summary: Reset a password
      operationId: resetPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile:
    put:
      summary: Update the current profile
      operationId: updateProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: Delete the current account
      operationId: deleteProfile
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Account deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile/password:
    put:
      summary: Change the current password
      operationId: updatePassword
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "204": { description: Password updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/categories:
    get:
      summary: List published course categories
      operationId: listCatalogCategories
      security: []
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/CollectionResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/courses:
    get:
      summary: List published courses
      operationId: listCatalogCourses
      security: []
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/CollectionResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/courses/{course}:
    get:
      summary: Read a published course, units, lessons, and prerequisites
      operationId: getCatalogCourse
      security: []
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/enrollments:
    get:
      summary: List the current learner's enrollments
      operationId: listEnrollments
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/CollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Enroll the current learner in a published course
      operationId: createEnrollment
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties:
                course_id: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        "201": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/learning/plan:
    get:
      summary: Get the current learner's ordered Today plan
      description: Orders due teacher lessons, FSRS reviews, eligible course work, then remediation.
      operationId: getLearningPlan
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/learning/sessions:
    post:
      summary: Start a learning session owned by the current learner
      operationId: startLearningSession
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartLearningSessionRequest" }
      responses:
        "201": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/learning/sessions/{session}/next:
    get:
      summary: Get the next activity in the learner-owned session
      operationId: nextLearningSessionActivity
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/learning/sessions/{session}/attempts:
    post:
      summary: Submit an answer or voice observation
      operationId: submitLearningAttempt
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningAttemptRequest" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /api/v1/learning/sessions/{session}/complete:
    post:
      summary: Complete the learner-owned session and return its summary
      operationId: completeLearningSession
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/fsrs/due:
    get:
      summary: List vocabulary due for the current learner
      operationId: listFsrsDue
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/CollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/fsrs/stats:
    get:
      summary: Get the current learner's FSRS statistics
      operationId: getFsrsStats
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/fsrs/review:
    post:
      summary: Apply one idempotent FSRS-6 review
      operationId: reviewVocabulary
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FsrsReviewRequest" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/assignments:
    get:
      summary: List assignments for the current learner
      operationId: listLearnerAssignments
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/progress:
    get:
      summary: Get personal course and lesson progress
      operationId: getLearnerProgress
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/CollectionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/progress/dashboard:
    get:
      summary: Get the current learner's progress dashboard
      operationId: getLearnerProgressDashboard
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/progress/course/{course}:
    get:
      summary: Get progress for one published course
      operationId: getLearnerCourseProgress
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/progress/lesson/{lesson}/complete:
    post:
      summary: Confirm progress for a lesson completed through an owned session
      operationId: confirmLearnerLessonProgress
      security: [{ session: [], csrf: [] }]
      parameters:
        - name: lesson
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/ai/trace-cag:
    post:
      summary: Request bounded TraceCAG assistance
      operationId: traceCagAssistance
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TraceCagAssistanceRequest" }
      responses:
        "200": { $ref: "#/components/responses/AssistanceResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /api/v1/ai/speech-to-text:
    post:
      summary: Transcribe learner audio
      operationId: speechToText
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody: { $ref: "#/components/requestBodies/AudioRequest" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /api/v1/ai/pronunciation:
    post:
      summary: Assess learner pronunciation
      operationId: assessPronunciation
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody: { $ref: "#/components/requestBodies/AudioRequest" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /api/v1/ai/text-to-speech:
    post:
      summary: Synthesize learner-safe speech
      operationId: textToSpeech
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                voice: { type: string, maxLength: 50 }
              additionalProperties: false
      responses:
        "200":
          description: Synthesized audio
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /api/v1/teacher/learners:
    get:
      summary: List learners assigned to the current teacher
      operationId: listTeacherLearners
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/teacher/learners/{learner}:
    get:
      summary: Read one assigned learner
      operationId: getTeacherLearner
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teacher/learners/{learner}/progress:
    get:
      summary: Read progress for an assigned learner
      operationId: getTeacherLearnerProgress
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teacher/learners/{learner}/evidence:
    get:
      summary: List filtered learning evidence for an assigned learner
      operationId: listTeacherLearnerEvidence
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teacher/alerts:
    get:
      summary: List alerts for assigned learners
      operationId: listTeacherAlerts
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/teacher/alerts/{alert}:
    get:
      summary: Read an alert and bounded evidence for an assigned learner
      operationId: getTeacherAlert
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/AlertId" }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teacher/alerts/{alert}/resolve:
    post:
      summary: Resolve an assigned learner's alert
      operationId: resolveTeacherAlert
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/AlertId" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_code]
              properties:
                resolution_code: { type: string, minLength: 1, maxLength: 100 }
                note: { type: ["string", "null"], maxLength: 2000 }
              additionalProperties: false
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/teacher/assignments:
    get:
      summary: List assignments for assigned learners
      operationId: listTeacherAssignments
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
