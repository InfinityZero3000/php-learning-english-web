      security: [{ session: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: page_size
          schema: { type: integer }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
      responses:
        "200":
          description: Upstream response relayed as-is (not wrapped in a data/meta envelope)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/LexiLingoContentUnavailable" }
  /api/v1/content/youtube:
    get:
      summary: Proxy LexiLingo YouTube search content
      operationId: contentYoutube
      security: [{ session: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: page_size
          schema: { type: integer }
        - in: query
          name: language
          schema: { type: string }
      responses:
        "200":
          description: Upstream response relayed as-is (not wrapped in a data/meta envelope)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/LexiLingoContentUnavailable" }
  /api/v1/enrichment/words/{vocabulary}:
    post:
      summary: Enrich a vocabulary entry from external dictionary/translation/image sources
      operationId: enrichVocabulary
      security: [{ session: [] }]
      description: >-
        Guarded by both the route's `auth` middleware and a redundant
        in-closure `abort_unless(auth()->check(), 401)` — intentional
        belt-and-suspenders, not a bug. Only works when
        `APP_ENRICHMENT_ENABLED=true` and at least one of the enrichment
        provider env vars is configured; otherwise the service throws and
        the request fails with an unhandled 500 (no dedicated error
        contract exists for the disabled case today).
      parameters:
        - in: path
          name: vocabulary
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The vocabulary entry, updated in place with any newly enriched fields
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Vocabulary" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Vocabulary does not exist" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: english-learning-session
      description: Laravel web session cookie.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie value required for mutations.
  schemas:
    User:
      type: object
      required: [id, name, email, email_verified_at, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, "null"], format: date-time }
        role: { type: [string, "null"] }
    UserEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/User" }
        meta: { type: object }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MessageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Message" }
        meta: { type: object }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean, default: false }
    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    Vocabulary:
      type: object
      required: [id, word, meaning]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        word: { type: string }
        meaning: { type: string }
        definition: { type: [string, "null"] }
        translation: { type: [object, "null"] }
        pronunciation: { type: [string, "null"] }
        part_of_speech: { type: [string, "null"] }
        difficulty_level: { type: [string, "null"] }
        tags: { type: [array, "null"] }
        external_audio_url: { type: [string, "null"] }
    Level:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
        courses_count: { type: integer, description: "Present only when eager-loaded with a count." }
    CourseCategory:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        color: { type: [string, "null"] }
        sort_order: { type: integer }
        is_active: { type: boolean }
        courses_count: { type: integer, description: "Present only when eager-loaded with a count." }
    Topic:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        courses_count: { type: integer, description: "Present only when eager-loaded with a count." }
        vocabularies_count: { type: integer, description: "Present only when eager-loaded with a count." }
    Course:
      type: object
      required: [id, title, slug, status]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        title: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [draft, published] }
        language: { type: [string, "null"] }
        thumbnail_url: { type: [string, "null"] }
        estimated_duration: { type: [integer, "null"] }
        total_xp: { type: integer }
        level: { $ref: "#/components/schemas/Level" }
        category: { $ref: "#/components/schemas/CourseCategory" }
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }
        lessons_count: { type: integer, description: "Present only when eager-loaded with a count." }
        units_count: { type: integer, description: "Present only when eager-loaded with a count." }
    Lesson:
      type: object
      required: [id, title, slug, status]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        title: { type: string }
        slug: { type: string }
        lesson_type: { type: [string, "null"] }
        sort_order: { type: integer }
        status: { type: string, enum: [draft, published] }
        estimated_minutes: { type: [integer, "null"] }
        xp_reward: { type: integer }
        pass_threshold: { type: [integer, "null"] }
        course: { $ref: "#/components/schemas/Course" }
        unit_id: { type: [integer, "null"] }
        quizzes_count: { type: integer, description: "Present only when eager-loaded with a count." }
        vocabularies_count: { type: integer, description: "Present only when eager-loaded with a count." }
        content: { type: string, description: "Only present on the single-lesson detail response." }
    Bookmark:
      type: object
      required: [id, bookmark_type, created_at]
      properties:
        id: { type: integer }
        bookmark_type: { type: string, enum: [vocabulary, lesson] }
        vocabulary: { $ref: "#/components/schemas/Vocabulary" }
        lesson: { $ref: "#/components/schemas/Lesson" }
        created_at: { type: string, format: date-time }
    Answer:
      type: object
      required: [id, content]
      description: Never includes is_correct — that stays server-side until submit.
      properties:
        id: { type: integer }
        content: { type: string }
    Question:
      type: object
      required: [id, quiz_id, content]
      properties:
        id: { type: integer }
        quiz_id: { type: integer }
        content: { type: string }
        explanation: { type: [string, "null"] }
        sort_order: { type: integer }
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
    Quiz:
      type: object
      required: [id, lesson_id, title, passing_score, status]
      properties:
        id: { type: integer }
        lesson_id: { type: integer }
        title: { type: string }
        passing_score: { type: integer }
        status: { type: string, enum: [draft, published] }
        questions_count: { type: integer, description: "Present only when eager-loaded with a count." }
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        lesson: { $ref: "#/components/schemas/Lesson" }
    Attempt:
      type: object
      required: [id, quiz_id, score]
      properties:
        id: { type: integer }
        quiz_id: { type: integer }
        score: { type: number }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        quiz: { $ref: "#/components/schemas/Quiz" }
    Progress:
      type: object
      required: [id, lesson_id]
      properties:
        id: { type: integer }
        lesson_id: { type: integer }
        completed_at: { type: [string, "null"], format: date-time }
        lesson: { $ref: "#/components/schemas/Lesson" }
    AdminUser:
      type: object
      required: [id, email, name, avatarUrl, role, locked, createdAt, lastLoginAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, description: "Always empty — no avatar feature exists yet." }
        role: { type: string, enum: [USER, ADMIN, MODERATOR] }
        locked: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
    AdminUsersResponse:
      type: object
      required: [users, totalElements, totalPages, page, size]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        totalElements: { type: integer }
        totalPages: { type: integer }
        page: { type: integer, description: "0-indexed." }
        size: { type: integer }
    AdminUserStats:
      type: object
      required: [totalWords, mastered, learning, accuracy, correctAnswers, incorrectAnswers]
      properties:
        totalWords: { type: integer }
        mastered: { type: integer }
        learning: { type: integer }
        accuracy: { type: number, description: "Percent, 0 when no reviews exist." }
        correctAnswers: { type: integer }
        incorrectAnswers: { type: integer }
    AdminUserStreak:
      type: object
      description: "No streak feature exists yet — always zeroed/null."
      required: [currentStreak, longestStreak, totalDaysStudied, lastStudyDate]
      properties:
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        totalDaysStudied: { type: integer }
        lastStudyDate: { type: [string, "null"] }
    AdminUserDetail:
      type: object
      required: [user, stats, streak, decks]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        stats: { $ref: "#/components/schemas/AdminUserStats" }
        streak: { $ref: "#/components/schemas/AdminUserStreak" }
        decks:
          type: array
          items: {}
          description: "No deck feature exists yet — always empty."
    AdminReviewHistoryItem:
      type: object
      required: [id, word, rating, correct, reviewedAt]
      properties:
        id: { type: integer }
        word: { type: string }
        rating: { type: integer, minimum: 1, maximum: 4 }
        correct: { type: boolean, description: "rating >= 3" }
        reviewedAt: { type: [string, "null"], format: date-time }
    AuditLogEntry:
      type: object
      required: [id, timestamp, action, actor, actorRole, resource, detail, ip, status]
      properties:
        id: { type: integer }
        timestamp: { type: string, format: date-time }
        action:
          type: string
          enum: [USER_LOCKED, USER_UNLOCKED, ROLE_CHANGED, PASSWORD_RESET]
        actor: { type: string, format: email, description: "Actor's email, snapshotted at write time." }
        actorRole: { type: string }
        resource: { type: string }
        detail: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        status: { type: string, enum: [SUCCESS, FAILED] }
  responses:
    UserResponse:
      description: User payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserEnvelope" }
    MessageResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    MessageEnvelopeResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageEnvelope" }
    EmailUnverified:
      description: Email verification required
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: EMAIL_UNVERIFIED }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Forbidden:
      description: Authenticated but not authorized (e.g. non-admin)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    CsrfError:
      description: CSRF token mismatch
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    UpstreamError:
      description: LexiLingo AI service rejected or failed the request; upstream body is never relayed
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { type: string, enum: [UPSTREAM_REJECTED, UPSTREAM_ERROR, PROXY_ERROR] }
    UpstreamTimeout:
      description: LexiLingo AI service was unreachable within the configured timeout/retry budget
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: UPSTREAM_TIMEOUT }
    AdminMediaError:
      description: Path traversal rejected (400) or file not found (404) — a literal app-level JSON body, not a framework exception
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: ["Invalid file path", "File not found"] }
              meta: { type: object }
    LexiLingoContentUnavailable:
      description: The LexiLingo content proxy could not reach or parse the upstream response
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
