openapi: 3.1.0
info:
  title: Learning English API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Check API health
      operationId: health
      security: []
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version: { const: v1 }
  /api/v1/csrf-cookie:
    get:
      summary: Initialize the CSRF cookie
      operationId: csrfCookie
      security: []
      responses:
        "204":
          description: CSRF cookie initialized
          headers:
            Set-Cookie:
              schema: { type: string }
  /api/v1/vocabulary:
    get:
      summary: Read locally persisted vocabulary
      operationId: listVocabulary
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Vocabulary page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vocabulary" }
                  meta: { type: object }
  /api/v1/auth/register:
    post:
      summary: Register a learner account
      operationId: register
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/login:
    post:
      summary: Log in with a Laravel session
      operationId: login
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "403": { $ref: "#/components/responses/EmailUnverified" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/logout:
    post:
      summary: Log out the current user
      operationId: logout
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/auth/me:
    get:
      summary: Get the current user
      operationId: currentUser
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/email/resend:
    post:
      summary: Resend a pending verification email
      operationId: resendVerification
      security: [{ csrf: [] }]
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      summary: Verify a signed email link
      operationId: verifyEmail
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: hash
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: expires
          required: true
          schema: { type: integer }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to learner frontend
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "403": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/forgot:
    post:
      summary: Request a password reset email
      operationId: forgotPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/reset:
    post:
      summary: Reset a password
      operationId: resetPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile:
    put:
      summary: Update the current profile
      operationId: updateProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: Delete the current account
      operationId: deleteProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Account deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile/password:
    put:
      summary: Change the current password
      operationId: updatePassword
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "204": { description: Password updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/ai/translate:
    post:
      summary: Translate text via the LexiLingo AI service (server-side proxy)
      operationId: aiTranslate
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, target_lang]
              properties:
                text: { type: string, minLength: 1, maxLength: 5000 }
                target_lang: { type: string, minLength: 2, maxLength: 2 }
                source_lang: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Upstream translation result, relayed as-is inside the data envelope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /api/v1/ai/pronunciation:
    post:
      summary: Score pronunciation of an audio recording (server-side proxy)
      operationId: aiPronunciation
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, reference_text]
              properties:
                audio: { type: string, format: binary, description: "mp3/wav/m4a/ogg, size capped by LEXILINGO_AI_MAX_AUDIO_KB" }
                reference_text: { type: string, minLength: 1, maxLength: 500 }
                language: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Upstream pronunciation-assessment result, relayed as-is inside the data envelope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /api/v1/ai/speech-to-text:
    post:
      summary: Transcribe an audio recording (server-side proxy)
      operationId: aiSpeechToText
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: "mp3/wav/m4a/ogg, size capped by LEXILINGO_AI_MAX_AUDIO_KB" }
                language: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Upstream transcription result, relayed as-is inside the data envelope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /api/v1/ai/text-to-speech:
    post:
      summary: Synthesize speech audio from text (server-side proxy)
      operationId: aiTextToSpeech
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                voice: { type: [string, "null"], maxLength: 50 }
                language: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Synthesized audio bytes (binary, not JSON)
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: english-learning-session
      description: Laravel web session cookie.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie value required for mutations.
  schemas:
    User:
      type: object
      required: [id, name, email, email_verified_at, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, "null"], format: date-time }
        role: { type: [string, "null"] }
    UserEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/User" }
        meta: { type: object }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MessageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Message" }
        meta: { type: object }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean, default: false }
    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    Vocabulary:
      type: object
      required: [id, word, meaning]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        word: { type: string }
        meaning: { type: string }
        definition: { type: [string, "null"] }
        translation: { type: [object, "null"] }
        pronunciation: { type: [string, "null"] }
        part_of_speech: { type: [string, "null"] }
        difficulty_level: { type: [string, "null"] }
        tags: { type: [array, "null"] }
        external_audio_url: { type: [string, "null"] }
  responses:
    UserResponse:
      description: User payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserEnvelope" }
    MessageResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    MessageEnvelopeResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageEnvelope" }
    EmailUnverified:
      description: Email verification required
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: EMAIL_UNVERIFIED }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    CsrfError:
      description: CSRF token mismatch
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    UpstreamError:
      description: LexiLingo AI service rejected or failed the request; upstream body is never relayed
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { type: string, enum: [UPSTREAM_REJECTED, UPSTREAM_ERROR, PROXY_ERROR] }
    UpstreamTimeout:
      description: LexiLingo AI service was unreachable within the configured timeout/retry budget
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: UPSTREAM_TIMEOUT }
