components:
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RequestId:
      in: header
      name: X-Request-ID
      required: true
      schema: { type: string, format: uuid }
      description: Idempotency key. Reuse with a different normalized payload returns 409.
    CourseId:
      in: path
      name: course
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      in: path
      name: session
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    LearnerId:
      in: path
      name: learner
      required: true
      schema: { type: integer, minimum: 1 }
    AlertId:
      in: path
      name: alert
      required: true
      schema: { type: integer, minimum: 1 }
    AssignmentId:
      in: path
      name: assignment
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      in: path
      name: user
      required: true
      schema: { type: integer, minimum: 1 }
    CatalogResource:
      in: path
      name: resource
      required: true
      schema: { type: string, enum: [courses, units, lessons, vocabulary, quizzes] }
    ResourceId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    SyncRunId:
      in: path
      name: syncRun
      required: true
      schema: { type: integer, minimum: 1 }
    AlertRuleId:
      in: path
      name: alertRule
      required: true
      schema: { type: integer, minimum: 1 }
    TeacherAssignmentId:
      in: path
      name: teacherAssignment
      required: true
      schema: { type: integer, minimum: 1 }
    SecretName:
      in: path
      name: secret
      required: true
      schema:
        type: string
        enum:
          - lexilingo_partner_api_key
          - trace_cag_service_token
          - trace_cag_subject_secret
          - ai_service_key
  requestBodies:
    AudioRequest:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [audio]
            properties:
              audio:
                type: string
                format: binary
                description: mp3, wav, m4a, or ogg within the configured byte limit.
              reference_text: { type: string, maxLength: 500 }
              language: { type: string, minLength: 2, maxLength: 10 }
            additionalProperties: false
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: english-learning-session
      description: Laravel web session cookie.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie value required for mutations.
  schemas:
    User:
      type: object
      required: [id, name, email, email_verified_at, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, "null"], format: date-time }
        role: { type: [string, "null"] }
    UserEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/User" }
        meta: { type: object }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MessageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Message" }
        meta: { type: object }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean, default: false }
    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    Vocabulary:
      type: object
      required: [id, word, meaning]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        word: { type: string }
        meaning: { type: string }
        definition: { type: [string, "null"] }
        translation: { type: [object, "null"] }
        pronunciation: { type: [string, "null"] }
        part_of_speech: { type: [string, "null"] }
        difficulty_level: { type: [string, "null"] }
        tags: { type: [array, "null"] }
        external_audio_url: { type: [string, "null"] }
    ResponseMeta:
      type: object
      properties:
        request_id: { type: ["string", "null"], format: uuid }
        generated_at: { type: string, format: date-time }
      additionalProperties: false
    ContractData:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - category
            - course
            - vocabulary
            - enrollment
            - learning_plan
            - learning_session
            - fsrs_card
            - fsrs_stats
            - assignment
            - progress
            - user
            - supervision_alert
            - sync_run
            - service_status
            - quota_policy
            - alert_rule
            - audit_event
            - teacher_assignment
            - speech_to_text
            - pronunciation
        id: { type: [integer, string, "null"] }
        name: { type: string }
        title: { type: string }
        slug: { type: string }
        status: { type: string }
        user_id: { type: integer, minimum: 1 }
        learner_id: { type: integer, minimum: 1 }
        teacher_id: { type: integer, minimum: 1 }
        course_id: { type: integer, minimum: 1 }
        lesson_id: { type: ["integer", "null"], minimum: 1 }
        vocabulary_id: { type: ["integer", "null"], minimum: 1 }
        assignment_id: { type: ["integer", "null"], minimum: 1 }
        state: { type: string }
        due_at: { type: ["string", "null"], format: date-time }
        completed_at: { type: ["string", "null"], format: date-time }
        revision: { type: integer, minimum: 0 }
        due_count: { type: integer, minimum: 0 }
        new_count: { type: integer, minimum: 0 }
        learning_count: { type: integer, minimum: 0 }
        review_count: { type: integer, minimum: 0 }
        best_score: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        severity: { type: string }
        rule_code: { type: string }
        service: { type: string }
        healthy: { type: boolean }
        version: { type: [integer, string] }
        action: { type: string }
        transcript: { type: string, maxLength: 2000 }
        pronunciation_score: { type: number, minimum: 0, maximum: 100 }
        estimated_minutes: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [id, type, priority]
            properties:
              id: { type: [integer, string] }
              type: { type: string, enum: [teacher_lesson, fsrs_review, course_activity, remediation] }
              priority: { type: integer, minimum: 1 }
            additionalProperties: false
      additionalProperties: false
    DataEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ContractData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
    CollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContractData" }
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            request_id: { type: ["string", "null"], format: uuid }
          additionalProperties: false
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
      additionalProperties: false
    StartLearningSessionRequest:
      type: object
      properties:
        enrollment_id: { type: integer, minimum: 1 }
        assignment_id: { type: integer, minimum: 1 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
      additionalProperties: false
    LearningAttemptRequest:
      type: object
      required: [activity_id, answer, duration_ms, hint_count]
      properties:
        activity_id: { type: string, minLength: 1, maxLength: 128 }
        answer: { type: string, maxLength: 2000 }
        duration_ms: { type: integer, minimum: 0, maximum: 3600000 }
        hint_count: { type: integer, minimum: 0, maximum: 100 }
        transcript: { type: ["string", "null"], maxLength: 2000 }
        pronunciation:
          type: ["object", "null"]
          properties:
            score: { type: number, minimum: 0, maximum: 100 }
          additionalProperties: false
      additionalProperties: false
    FsrsReviewRequest:
      type: object
      required: [user_vocabulary_id, rating, base_revision, reviewed_at]
      properties:
        user_vocabulary_id: { type: integer, minimum: 1 }
        rating: { type: string, enum: [again, hard, good, easy] }
        base_revision: { type: integer, minimum: 0 }
        reviewed_at: { type: string, format: date-time }
      additionalProperties: false
    TraceCagAssistanceRequest:
      type: object
      required: [session_id, activity_id, input_type, text]
      properties:
        session_id: { type: string, minLength: 1, maxLength: 128 }
        activity_id: { type: string, minLength: 1, maxLength: 128 }
        input_type: { type: string, enum: [answer, hint_request, pronunciation, tutor_message] }
        text: { type: string, minLength: 1, maxLength: 2000 }
      additionalProperties: false
    AssistanceEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [assistance]
          properties:
            assistance:
              type: object
              required: [status, reason_code, message, hints, recommended_action]
              properties:
                status: { type: string, enum: [available, degraded] }
                reason_code:
                  type: ["string", "null"]
                  enum: [null, timeout, unavailable, quota, feature_disabled, invalid_response]
                message: { type: string, minLength: 1, maxLength: 2000 }
                hints:
                  type: array
                  maxItems: 3
                  items: { type: string, minLength: 1, maxLength: 500 }
                recommended_action:
                  type: string
                  enum: [continue, retry, review_prerequisite, practice_pronunciation, ask_teacher]
              additionalProperties: false
          additionalProperties: false
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
    AdminCatalogWriteRequest:
      oneOf:
        - { $ref: "#/components/schemas/AdminCourseWriteRequest" }
        - { $ref: "#/components/schemas/AdminUnitWriteRequest" }
        - { $ref: "#/components/schemas/AdminLessonWriteRequest" }
        - { $ref: "#/components/schemas/AdminVocabularyWriteRequest" }
        - { $ref: "#/components/schemas/AdminQuizWriteRequest" }
    AdminCourseWriteRequest:
      type: object
      required: [title, slug, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255 }
        description: { type: ["string", "null"], maxLength: 5000 }
        level_id: { type: ["integer", "null"], minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
      additionalProperties: false
    AdminUnitWriteRequest:
      type: object
      required: [course_id, title, sort_order]
      properties:
        course_id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: ["string", "null"], maxLength: 5000 }
        sort_order: { type: integer, minimum: 0 }
      additionalProperties: false
    AdminLessonWriteRequest:
      type: object
      required: [course_id, title, slug, status]
      properties:
        course_id: { type: integer, minimum: 1 }
        unit_id: { type: ["integer", "null"], minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255 }
        content: { type: ["string", "null"], maxLength: 50000 }
        status: { type: string, enum: [draft, published, archived] }
      additionalProperties: false
    AdminVocabularyWriteRequest:
      type: object
      required: [word, meaning]
      properties:
        lesson_id: { type: ["integer", "null"], minimum: 1 }
        word: { type: string, minLength: 1, maxLength: 255 }
        meaning: { type: string, minLength: 1, maxLength: 5000 }
        example: { type: ["string", "null"], maxLength: 5000 }
        pronunciation: { type: ["string", "null"], maxLength: 255 }
      additionalProperties: false
    AdminQuizWriteRequest:
      type: object
      required: [lesson_id, title, passing_score, status]
      properties:
        lesson_id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        passing_score: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [draft, published, archived] }
      additionalProperties: false
    AssignmentRequest:
      type: object
      required: [learner_id, due_at]
      properties:
        learner_id: { type: integer, minimum: 1 }
        lesson_id: { type: integer, minimum: 1 }
        vocabulary_id: { type: integer, minimum: 1 }
        due_at: { type: string, format: date-time }
        instructions: { type: ["string", "null"], maxLength: 2000 }
      oneOf:
        - required: [lesson_id]
          not: { required: [vocabulary_id] }
        - required: [vocabulary_id]
          not: { required: [lesson_id] }
      additionalProperties: false
    QuotaPolicyRequest:
      type: object
      required: [limits, password]
      properties:
        limits:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        password: { type: string, minLength: 1 }
      additionalProperties: false
    TeacherScopeRequest:
      type: object
      required: [teacher_id, learner_id, password]
      properties:
        teacher_id: { type: integer, minimum: 1 }
        learner_id: { type: integer, minimum: 1 }
        password: { type: string, minLength: 1 }
      additionalProperties: false
  responses:
    DataResponse:
      description: Stable data envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DataEnvelope" }
    CollectionResponse:
      description: Paginated stable data envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CollectionEnvelope" }
    AssistanceResponse:
      description: Assistance result; upstream failure is returned as deterministic degraded feedback
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssistanceEnvelope" }
    Forbidden:
      description: The authenticated role or assigned scope does not permit this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Idempotency key conflict, stale revision, or incompatible state transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Request quota exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    FeatureDisabled:
      description: Feature is disabled or its provider is unavailable
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/ErrorEnvelope" }
              - type: object
                properties:
                  code: { enum: [feature_disabled, provider_unavailable] }
    UserResponse:
      description: User payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserEnvelope" }
    MessageResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    MessageEnvelopeResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageEnvelope" }
    EmailUnverified:
      description: Email verification required
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: EMAIL_UNVERIFIED }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    CsrfError:
      description: CSRF token mismatch
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
