openapi: 3.1.0
info:
  title: Learning English API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Check API health
      operationId: health
      security: []
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version: { const: v1 }
  /api/v1/csrf-cookie:
    get:
      summary: Initialize the CSRF cookie
      operationId: csrfCookie
      security: []
      responses:
        "204":
          description: CSRF cookie initialized
          headers:
            Set-Cookie:
              schema: { type: string }
  /api/v1/vocabulary:
    get:
      summary: Read locally persisted vocabulary
      operationId: listVocabulary
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Vocabulary page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vocabulary" }
                  meta: { type: object }
  /api/v1/auth/register:
    post:
      summary: Register a learner account
      operationId: register
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/login:
    post:
      summary: Log in with a Laravel session
      operationId: login
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "403": { $ref: "#/components/responses/EmailUnverified" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/logout:
    post:
      summary: Log out the current user
      operationId: logout
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/auth/me:
    get:
      summary: Get the current user
      operationId: currentUser
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/email/resend:
    post:
      summary: Resend a pending verification email
      operationId: resendVerification
      security: [{ csrf: [] }]
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      summary: Verify a signed email link
      operationId: verifyEmail
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: hash
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: expires
          required: true
          schema: { type: integer }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to learner frontend
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "403": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/forgot:
    post:
      summary: Request a password reset email
      operationId: forgotPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/reset:
    post:
      summary: Reset a password
      operationId: resetPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile:
    put:
      summary: Update the current profile
      operationId: updateProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: Delete the current account
      operationId: deleteProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Account deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile/password:
    put:
      summary: Change the current password
      operationId: updatePassword
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "204": { description: Password updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/admin/users:
    get:
      summary: List users (admin)
      operationId: adminListUsers
      security: [{ session: [] }]
      parameters:
        - in: query
          name: email
          description: Matches against name OR email.
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [active, locked] }
        - in: query
          name: role
          schema: { type: string, enum: [USER, ADMIN, MODERATOR] }
        - in: query
          name: page
          description: 0-indexed.
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/users/{user}:
    get:
      summary: Get user detail (admin)
      operationId: adminGetUser
      security: [{ session: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User detail with learning stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MessageResponse" }
  /api/admin/users/{user}/history:
    get:
      summary: Get a user's vocabulary review history (admin)
      operationId: adminGetUserHistory
      security: [{ session: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Review history, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminReviewHistoryItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MessageResponse" }
  /api/admin/users/{user}/lock:
    put:
      summary: Lock a user account (admin)
      operationId: adminLockUser
      security: [{ session: [], csrf: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated user (idempotent if already locked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MessageResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422":
          description: Blocked self-lock or locking the last active admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
  /api/admin/users/{user}/unlock:
    put:
      summary: Unlock a user account (admin)
      operationId: adminUnlockUser
      security: [{ session: [], csrf: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated user (idempotent if already unlocked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MessageResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/admin/users/{user}/reset-password:
    post:
      summary: Generate a one-time temporary password for a user (admin)
      operationId: adminResetUserPassword
      security: [{ session: [], csrf: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Temporary password, shown once and never logged
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MessageResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/admin/users/{user}/role:
    put:
      summary: Change a user's role (admin)
      operationId: adminUpdateUserRole
      security: [{ session: [], csrf: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [USER, ADMIN] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MessageResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422":
          description: Invalid role, or blocked last-admin-demote / self-demote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
  /api/admin/audit-logs:
    get:
      summary: List audit log entries (admin)
      operationId: adminListAuditLogs
      security: [{ session: [] }]
      responses:
        "200":
          description: Latest audit log entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ai/translate:
    post:
      summary: Translate text via the LexiLingo AI service (server-side proxy)
      operationId: aiTranslate
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, target_lang]
              properties:
                text: { type: string, minLength: 1, maxLength: 5000 }
                target_lang: { type: string, minLength: 2, maxLength: 2 }
                source_lang: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Upstream translation result, relayed as-is inside the data envelope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /api/v1/ai/pronunciation:
    post:
      summary: Score pronunciation of an audio recording (server-side proxy)
      operationId: aiPronunciation
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, reference_text]
              properties:
                audio: { type: string, format: binary, description: "mp3/wav/m4a/ogg, size capped by LEXILINGO_AI_MAX_AUDIO_KB" }
                reference_text: { type: string, minLength: 1, maxLength: 500 }
                language: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Upstream pronunciation-assessment result, relayed as-is inside the data envelope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /api/v1/ai/speech-to-text:
    post:
      summary: Transcribe an audio recording (server-side proxy)
      operationId: aiSpeechToText
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: "mp3/wav/m4a/ogg, size capped by LEXILINGO_AI_MAX_AUDIO_KB" }
                language: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Upstream transcription result, relayed as-is inside the data envelope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /api/v1/ai/text-to-speech:
    post:
      summary: Synthesize speech audio from text (server-side proxy)
      operationId: aiTextToSpeech
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                voice: { type: [string, "null"], maxLength: 50 }
                language: { type: [string, "null"], minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Synthesized audio bytes (binary, not JSON)
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: english-learning-session
      description: Laravel web session cookie.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded XSRF-TOKEN cookie value required for mutations.
  schemas:
    User:
      type: object
      required: [id, name, email, email_verified_at, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, "null"], format: date-time }
        role: { type: [string, "null"] }
    UserEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/User" }
        meta: { type: object }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MessageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Message" }
        meta: { type: object }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean, default: false }
    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    Vocabulary:
      type: object
      required: [id, word, meaning]
      properties:
        id: { type: integer }
        external_id: { type: [string, "null"] }
        word: { type: string }
        meaning: { type: string }
        definition: { type: [string, "null"] }
        translation: { type: [object, "null"] }
        pronunciation: { type: [string, "null"] }
        part_of_speech: { type: [string, "null"] }
        difficulty_level: { type: [string, "null"] }
        tags: { type: [array, "null"] }
        external_audio_url: { type: [string, "null"] }
    AdminUser:
      type: object
      required: [id, email, name, avatarUrl, role, locked, createdAt, lastLoginAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, description: "Always empty — no avatar feature exists yet." }
        role: { type: string, enum: [USER, ADMIN, MODERATOR] }
        locked: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
    AdminUsersResponse:
      type: object
      required: [users, totalElements, totalPages, page, size]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        totalElements: { type: integer }
        totalPages: { type: integer }
        page: { type: integer, description: "0-indexed." }
        size: { type: integer }
    AdminUserStats:
      type: object
      required: [totalWords, mastered, learning, accuracy, correctAnswers, incorrectAnswers]
      properties:
        totalWords: { type: integer }
        mastered: { type: integer }
        learning: { type: integer }
        accuracy: { type: number, description: "Percent, 0 when no reviews exist." }
        correctAnswers: { type: integer }
        incorrectAnswers: { type: integer }
    AdminUserStreak:
      type: object
      description: "No streak feature exists yet — always zeroed/null."
      required: [currentStreak, longestStreak, totalDaysStudied, lastStudyDate]
      properties:
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        totalDaysStudied: { type: integer }
        lastStudyDate: { type: [string, "null"] }
    AdminUserDetail:
      type: object
      required: [user, stats, streak, decks]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        stats: { $ref: "#/components/schemas/AdminUserStats" }
        streak: { $ref: "#/components/schemas/AdminUserStreak" }
        decks:
          type: array
          items: {}
          description: "No deck feature exists yet — always empty."
    AdminReviewHistoryItem:
      type: object
      required: [id, word, rating, correct, reviewedAt]
      properties:
        id: { type: integer }
        word: { type: string }
        rating: { type: integer, minimum: 1, maximum: 4 }
        correct: { type: boolean, description: "rating >= 3" }
        reviewedAt: { type: [string, "null"], format: date-time }
    AuditLogEntry:
      type: object
      required: [id, timestamp, action, actor, actorRole, resource, detail, ip, status]
      properties:
        id: { type: integer }
        timestamp: { type: string, format: date-time }
        action:
          type: string
          enum: [USER_LOCKED, USER_UNLOCKED, ROLE_CHANGED, PASSWORD_RESET]
        actor: { type: string, format: email, description: "Actor's email, snapshotted at write time." }
        actorRole: { type: string }
        resource: { type: string }
        detail: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        status: { type: string, enum: [SUCCESS, FAILED] }
  responses:
    UserResponse:
      description: User payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserEnvelope" }
    MessageResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    MessageEnvelopeResponse:
      description: Operation result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageEnvelope" }
    EmailUnverified:
      description: Email verification required
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: EMAIL_UNVERIFIED }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Forbidden:
      description: Authenticated but not authorized (e.g. non-admin)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    CsrfError:
      description: CSRF token mismatch
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    UpstreamError:
      description: LexiLingo AI service rejected or failed the request; upstream body is never relayed
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { type: string, enum: [UPSTREAM_REJECTED, UPSTREAM_ERROR, PROXY_ERROR] }
    UpstreamTimeout:
      description: LexiLingo AI service was unreachable within the configured timeout/retry budget
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: { type: string }
              code: { const: UPSTREAM_TIMEOUT }
