openapi: 3.1.0
info:
  title: Learning English API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
paths:
  /api/v1:
    get:
      summary: API root info
      operationId: rootInfo
      security: []
      responses:
        "200":
          description: Basic app metadata and a link to the health endpoint
          content:
            application/json:
              schema:
                type: object
                required: [name, version, status, health]
                properties:
                  name: { type: string }
                  version: { const: v1 }
                  status: { const: ok }
                  health: { type: string, format: uri }
  /api/v1/health:
    get:
      summary: Check API health
      operationId: health
      security: []
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version: { const: v1 }
  /api/v1/csrf-cookie:
    get:
      summary: Initialize the CSRF cookie
      operationId: csrfCookie
      security: []
      responses:
        "204":
          description: CSRF cookie initialized
          headers:
            Set-Cookie:
              schema: { type: string }
  /api/v1/vocabulary:
    get:
      summary: Read locally persisted vocabulary
      operationId: listVocabulary
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Vocabulary page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vocabulary" }
                  meta: { type: object }
  /api/v1/auth/register:
    post:
      summary: Register a learner account
      operationId: register
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/login:
    post:
      summary: Log in with a Laravel session
      operationId: login
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "403": { $ref: "#/components/responses/EmailUnverified" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/oauth/{provider}:
    get:
      summary: Start an OAuth login (Google/Facebook)
      operationId: oauthRedirect
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, facebook] }
        - in: query
          name: next
          description: Learner-frontend-relative path to return to after login; sanitized server-side.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the provider's consent screen
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "404": { description: "Unknown provider" }
  /api/v1/auth/oauth/{provider}/callback:
    get:
      summary: OAuth provider callback
      operationId: oauthCallback
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, facebook] }
      description: >-
        Always responds with a redirect, never JSON. On success, creates or
        logs in a learner account and redirects to
        `{FRONTEND_URL}/auth/callback?next=...`. On failure, redirects to
        `{FRONTEND_URL}/login?oauth_error=<code>` where `code` is one of
        `cancelled`, `email_missing`, `role_conflict`, `invalid_state`,
        `provider_failed` (an existing non-learner account, e.g. an admin,
        attempting OAuth login maps to `role_conflict`).
      responses:
        "302":
          description: Redirect to the learner frontend (success or mapped failure)
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "404": { description: "Unknown provider" }
  /api/v1/auth/logout:
    post:
      summary: Log out the current user
      operationId: logout
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/auth/me:
    get:
      summary: Get the current user
      operationId: currentUser
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/email/resend:
    post:
      summary: Resend a pending verification email
      operationId: resendVerification
      security: [{ csrf: [] }]
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      summary: Verify a signed email link
      operationId: verifyEmail
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: hash
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: expires
          required: true
          schema: { type: integer }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to learner frontend
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "403": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/forgot:
    post:
      summary: Request a password reset email
      operationId: forgotPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/MessageResponse" }
  /api/v1/auth/password/reset:
    post:
      summary: Reset a password
      operationId: resetPassword
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/MessageEnvelopeResponse" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile:
    put:
      summary: Update the current profile
      operationId: updateProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: Delete the current account
      operationId: deleteProfile
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Account deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/profile/password:
    put:
      summary: Change the current password
      operationId: updatePassword
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "204": { description: Password updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/courses:
    get:
      summary: List published courses
      operationId: listCourses
      security: []
      parameters:
        - in: query
          name: search
          description: Matches title or description.
          schema: { type: string }
        - in: query
          name: level_id
          schema: { type: integer }
        - in: query
          name: category_id
          schema: { type: integer }
        - in: query
          name: topic_id
          schema: { type: integer }
        - in: query
          name: sort_by
          schema: { type: string, enum: [title, created_at], default: total_xp }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated published courses
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Course" }
                  meta: { type: object }
  /api/v1/catalog/courses/{course}:
    get:
      summary: Get a published course's detail
      operationId: getCourse
      security: []
      parameters:
        - in: path
          name: course
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Course" }
                  meta: { type: object }
        "404": { description: "Course does not exist, or exists but is not published" }
  /api/v1/catalog/courses/{course}/lessons:
    get:
      summary: List a published course's published lessons
      operationId: listCourseLessons
      security: []
      parameters:
        - in: path
          name: course
          required: true
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated lessons for the course
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Lesson" }
                  meta: { type: object }
        "404": { description: "Course does not exist, or exists but is not published" }
  /api/v1/catalog/lessons:
    get:
      summary: List published lessons (across published courses)
      operationId: listLessons
      security: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: course_id
          schema: { type: integer }
        - in: query
          name: lesson_type
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated published lessons
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Lesson" }
                  meta: { type: object }
  /api/v1/catalog/lessons/{lesson}:
    get:
      summary: Get a published lesson's detail (with content)
      operationId: getLesson
      security: []
      parameters:
        - in: path
          name: lesson
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lesson detail, including body content
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Lesson" }
                  meta: { type: object }
        "404": { description: "Lesson (or its course) does not exist, or exists but is not published" }
  /api/v1/bookmarks:
    get:
      summary: List the current user's bookmarks
      operationId: listBookmarks
      security: [{ session: [] }]
      parameters:
        - in: query
          name: bookmark_type
          description: Exact-match filter; unknown values simply return an empty page, not a validation error.
          schema: { type: string, enum: [vocabulary, lesson] }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated bookmarks
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Bookmark" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/bookmarks/vocabulary/{vocabulary}/toggle:
    post:
      summary: Toggle a bookmark on a vocabulary item
      operationId: toggleVocabularyBookmark
      security: [{ session: [], csrf: [] }]
      parameters:
        - in: path
          name: vocabulary
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Bookmark removed (it existed)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [status], properties: { status: { const: unbookmarked } } }
                  meta: { type: object }
        "201":
          description: Bookmark created (it did not exist)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [status], properties: { status: { const: bookmarked } } }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Vocabulary does not exist" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/bookmarks/lesson/{lesson}/toggle:
    post:
      summary: Toggle a bookmark on a lesson
      operationId: toggleLessonBookmark
      security: [{ session: [], csrf: [] }]
      parameters:
        - in: path
          name: lesson
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Bookmark removed (it existed)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [status], properties: { status: { const: unbookmarked } } }
                  meta: { type: object }
        "201":
          description: Bookmark created (it did not exist)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [status], properties: { status: { const: bookmarked } } }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Lesson does not exist" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/v1/quizzes/{quiz}:
    get:
      summary: Get a published quiz with its questions and answers
      operationId: getQuiz
      security: [{ session: [] }]
      description: Answer options never include `is_correct` — that stays server-side until submit.
      parameters:
        - in: path
          name: quiz
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Quiz with nested questions/answers
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Quiz" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Quiz does not exist, or the quiz/lesson/course chain is not fully published" }
  /api/v1/quizzes/{quiz}/submit:
    post:
      summary: Submit quiz answers and get a score
      operationId: submitQuiz
      security: [{ session: [], csrf: [] }]
      description: >-
        Idempotent per (user, quiz): the first submission creates and scores
        an Attempt (201); resubmitting returns the original Attempt
        unchanged (200) rather than re-scoring or creating a duplicate.
      parameters:
        - in: path
          name: quiz
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [question_id, answer_id]
                    properties:
                      question_id: { type: integer }
                      answer_id: { type: integer }
      responses:
        "200":
          description: Already-completed attempt, returned unchanged (idempotent resubmit)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Attempt" }
                  meta: { type: object }
        "201":
          description: First submission, newly scored
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Attempt" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Quiz does not exist, or the quiz/lesson/course chain is not fully published" }
        "419": { $ref: "#/components/responses/CsrfError" }
        "422":
          description: Missing/invalid answers, or an answer_id that does not belong to its submitted question_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
  /api/v1/quizzes/{quiz}/history:
    get:
      summary: List the current user's attempts for a quiz
      operationId: getQuizHistory
      security: [{ session: [] }]
      parameters:
        - in: path
          name: quiz
          required: true
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated attempts, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Attempt" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Quiz does not exist, or the quiz/lesson/course chain is not fully published" }
  /api/v1/progress:
    get:
      summary: List the current user's lesson-completion progress
      operationId: listMyProgress
      security: [{ session: [] }]
      parameters:
        - in: query
          name: course_id
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated progress records
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Progress" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/progress/dashboard:
    get:
      summary: Get the current user's learning dashboard overview
      operationId: getProgressDashboard
      security: [{ session: [] }]
      responses:
        "200":
          description: Overview counters plus recent activity/attempts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [overview, recent_activity, recent_attempts]
                    properties:
                      overview:
                        type: object
                        required: [completed_lessons, quiz_attempts, average_score]
                        properties:
                          completed_lessons: { type: integer }
                          quiz_attempts: { type: integer }
                          average_score: { type: number }
                      recent_activity:
                        type: array
                        items: { $ref: "#/components/schemas/Progress" }
                      recent_attempts:
                        type: array
                        items: { $ref: "#/components/schemas/Attempt" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/progress/course/{course}:
    get:
      summary: Get the current user's completion percentage for a course
      operationId: getCourseProgress
      security: [{ session: [] }]
      parameters:
        - in: path
          name: course
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Completion summary for the course
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [course, progress_percent, completed_lessons, total_lessons]
                    properties:
                      course:
                        type: object
                        required: [id, title]
                        properties:
                          id: { type: integer }
                          title: { type: string }
                      progress_percent: { type: integer }
                      completed_lessons: { type: integer }
                      total_lessons: { type: integer }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Course does not exist, or exists but is not published" }
  /api/v1/progress/lesson/{lesson}/complete:
    post:
      summary: Mark a lesson as completed for the current user
      operationId: markLessonCompleted
      security: [{ session: [], csrf: [] }]
      description: Idempotent — resubmitting does not update the original completed_at timestamp or create a duplicate record.
      parameters:
        - in: path
          name: lesson
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked completed (or already was)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, required: [status], properties: { status: { const: completed } } }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Lesson does not exist, or the lesson/course chain is not fully published" }
        "419": { $ref: "#/components/responses/CsrfError" }
  /api/admin/users:
    get:
      summary: List users (admin)
      operationId: adminListUsers
      security: [{ session: [] }]
      parameters:
        - in: query
          name: email
          description: Matches against name OR email.
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [active, locked] }
        - in: query
          name: role
          schema: { type: string, enum: [USER, ADMIN, MODERATOR] }
        - in: query
          name: page
          description: 0-indexed.
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/users/{user}:
    get:
      summary: Get user detail (admin)
      operationId: adminGetUser
      security: [{ session: [] }]
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User detail with learning stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
